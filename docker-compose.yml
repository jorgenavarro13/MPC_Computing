# Plug-and-play runner for the webSPDZ browser demo.
#
#   docker compose up --build
#
# Then each participant opens the lobby, which assigns seats automatically:
#   https://localhost:8000/atlas-lobby.html        (4 tabs on this machine), or
#   https://<this-machine-LAN-IP>:8000/atlas-lobby.html   (other devices on the same Wi-Fi)
# Both ports are published on all host interfaces, so the second form works
# from other laptops as long as the host firewall allows 8000 and 8080.
#
# Chrome will warn about the self-signed certificate on first visit to both
# https://<host>:8000 and https://<host>:8080 — click through/accept it on
# each device before opening the lobby (the signaling server also needs the
# cert trusted since it speaks wss://). Works the same on Linux, Intel Mac
# and Apple Silicon Mac — nothing here is architecture-specific.
#
# Stop with Ctrl+C, or `docker compose down`.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.demo
    image: webspdz-demo:local
    command: ["python3", "https-server.py", "0.0.0.0", "8000"]
    ports:
      - "8000:8000"

  signaling:
    image: webspdz-demo:local
    command: ["node", "signaling_wss_server.js", "0.0.0.0", "8080"]
    ports:
      - "8080:8080"
    depends_on:
      - web
